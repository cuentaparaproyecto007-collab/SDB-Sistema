version: '3.8'

services:
  # Base de Datos PostgreSQL
  database:
    image: postgres:15-alpine
    container_name: sdb-database
    restart: always
    environment:
      POSTGRES_DB: proyecto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1245678910"
    ports:
      - "5432:5432"
    volumes:
      - sdb_db_data:/var/lib/postgresql/data
    networks:
      - sdb-network

  # Servicio Backend / API REST (Laravel)
  backend:
    build:
      context: ./Sistema-backend
      dockerfile: Dockerfile
    container_name: sdb-backend
    restart: always
    depends_on:
      - database
    ports:
      - "8000:8000"
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: proyecto
      DB_USERNAME: postgres
      DB_PASSWORD: "1245678910"
    networks:
      - sdb-network

  # Servicio Cliente / Frontend (Vue)
  frontend:
    build:
      context: ./Sistema-frontend
      dockerfile: Dockerfile
    container_name: sdb-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - sdb-network

volumes:
  sdb_db_data:

networks:
  sdb-network:
    driver: bridge